[project]
name = "pcc"
version = "0.1.0"
description = "Placement Career Coach"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["pcc.domain", "pcc.workflow"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: real-browser tests, run with PCC_E2E=1 (need Playwright and Edge or Chrome)"]

[tool.coverage.run]
source = ["pcc.domain.scoring", "pcc.domain.weekly_plan_builder", "pcc.domain.progress"]
