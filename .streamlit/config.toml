[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5FB"
textColor = "#1F2937"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# The default watcher (watchdog) runs one thread per watched folder. On Windows with Python 3.14
# it crashed the whole server with "Fatal Python error: _PySemaphore_Wakeup" during long browser
# test runs. Edited pages are not hot-reloaded reliably anyway, so restart the app after changes.
fileWatcherType = "none"
runOnSave = false
